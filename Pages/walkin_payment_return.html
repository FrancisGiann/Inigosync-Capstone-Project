<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Walk-in payment | IñigoSync</title>
    <link rel="icon" type="image/png" href="../assets/Logo/WebLogo.png">
    <style>
        :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #242019; background: #f8f5ef; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
        main { width: min(100%, 440px); padding: 32px; box-sizing: border-box; background: #fff; border: 1px solid #e5ddd1; border-radius: 16px; }
        .brand { color: #a54d00; font-size: .85rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
        h1 { margin: 18px 0 12px; font-size: clamp(1.55rem, 5vw, 2rem); line-height: 1.18; }
        p { margin: 0 0 12px; line-height: 1.55; color: #544d43; }
        .notice { margin-top: 22px; padding: 14px 16px; background: #fff3e5; border-left: 4px solid #db720e; border-radius: 4px; color: #352b1e; }
        a { display: inline-block; margin-top: 24px; color: #894000; font-weight: 700; text-underline-offset: 3px; }
        a:focus-visible { outline: 3px solid #db720e; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <div class="brand">IñigoSync · Walk-in</div>
        <h1 id="payment-heading">Return to the front desk</h1>
        <p id="payment-message">Ask the staff to check your payment status before entering the court.</p>
        <p class="notice">Only a confirmed payment can issue your entry pass. Keep your PayMongo or GCash confirmation for reference.</p>
        <a href="../index.html">IñigoSync home</a>
    </main>
    <script>
        if (new URLSearchParams(location.search).get('result') === 'cancelled') {
            document.getElementById('payment-heading').textContent = 'Payment was not completed';
            document.getElementById('payment-message').textContent = 'Return to the front desk and ask the staff to help you try again.';
        }
    </script>
</body>
</html>
